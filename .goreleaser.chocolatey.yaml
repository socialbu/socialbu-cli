version: 2

project_name: socialbu

before:
  hooks:
    - go mod verify
    - go test ./...

builds:
  - id: socialbu-windows
    main: ./main.go
    binary: socialbu
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

archives:
  - id: chocolatey-packages
    ids:
      - socialbu-windows
    formats:
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

chocolateys:
  - name: socialbu
    ids:
      - chocolatey-packages
    package_source_url: https://github.com/socialbu/socialbu-cli
    owners: Glaxosoft LLC
    title: SocialBu CLI
    authors: SocialBu
    project_url: https://socialbu.com/
    url_template: https://github.com/socialbu/socialbu-cli/releases/download/{{ .Tag }}/{{ .ArtifactName }}
    copyright: Copyright SocialBu
    license_url: https://socialbu.com/about/terms
    require_license_acceptance: false
    project_source_url: https://github.com/socialbu/socialbu-cli
    docs_url: https://github.com/socialbu/socialbu-cli#readme
    bug_tracker_url: https://github.com/socialbu/socialbu-cli/issues
    tags: socialbu social-media cli
    summary: Manage SocialBu from the command line.
    description: A command-line client for managing SocialBu accounts, posts, teams, analytics, notifications, curated content, media, and AI features.
    release_notes: https://github.com/socialbu/socialbu-cli/releases/tag/{{ .Tag }}
    skip_publish: true

checksum:
  name_template: checksums.txt

changelog:
  disable: true
