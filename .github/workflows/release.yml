name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'vMAJOR.MINOR.PATCH tag to create, for example v0.1.2'
        required: true
        type: string
      target:
        description: 'Commit SHA or branch to tag'
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref }}

      - name: Create release tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must look like vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          existing_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          if [ -n "$existing_tag" ]; then
            git fetch --tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_target=$(git rev-list -n 1 "$RELEASE_TAG")
            head_target=$(git rev-parse HEAD)
            if [ "$tag_target" = "$head_target" ]; then
              echo "Tag $RELEASE_TAG already points to $head_target; continuing"
              exit 0
            fi
            echo "Tag $RELEASE_TAG already exists on origin but points to $tag_target, not $head_target" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
