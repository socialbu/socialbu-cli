name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'vMAJOR.MINOR.PATCH tag to create, for example v0.1.2'
        required: true
        type: string
      target:
        description: 'Commit SHA or branch to tag'
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  goreleaser:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref }}

      - name: Create release tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must look like vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          existing_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          if [ -n "$existing_tag" ]; then
            git fetch --tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_target=$(git rev-list -n 1 "$RELEASE_TAG")
            head_target=$(git rev-parse HEAD)
            if [ "$tag_target" = "$head_target" ]; then
              echo "Tag $RELEASE_TAG already points to $head_target; continuing"
              exit 0
            fi
            echo "Tag $RELEASE_TAG already exists on origin but points to $tag_target, not $head_target" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve WinGet manifests
        uses: actions/upload-artifact@v6
        with:
          name: winget-manifests-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: dist/winget
          if-no-files-found: error
          retention-days: 30

      - name: Attest release artifacts
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt

  validate-installers:
    needs: goreleaser
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate macOS or Linux installer
        if: runner.os != 'Windows'
        env:
          SOCIALBU_INSTALL_DIR: ${{ runner.temp }}/socialbu-bin
          SOCIALBU_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          ./scripts/install.sh
          "$SOCIALBU_INSTALL_DIR/socialbu" version | grep "socialbu ${RELEASE_VERSION#v}"

      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "socialbu-bin"
          ./scripts/install.ps1 -Version $env:RELEASE_VERSION -InstallDir $installDir -NoPathUpdate
          $versionOutput = & (Join-Path $installDir "socialbu.exe") version
          if ($versionOutput -notcontains "socialbu $($env:RELEASE_VERSION.TrimStart('v'))") {
            throw "Installed binary did not report the expected version"
          }

  validate-packages:
    needs: goreleaser
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate Homebrew package
        if: runner.os == 'macOS'
        run: |
          brew tap socialbu/cli https://github.com/socialbu/socialbu-cli
          brew install --cask socialbu/cli/socialbu
          socialbu version | grep "socialbu ${RELEASE_VERSION#v}"

      - name: Validate Scoop package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          scoop bucket add socialbu https://github.com/socialbu/socialbu-cli
          scoop install socialbu/socialbu
          $versionOutput = socialbu version
          $version = $env:RELEASE_VERSION.TrimStart('v')
          if ($versionOutput -notcontains "socialbu $version") {
            throw "Scoop package did not install the expected version"
          }

  chocolatey:
    needs: goreleaser
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Build Chocolatey package
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $archiveName = "socialbu_${version}_windows_amd64.zip"
          $releaseDir = Join-Path $env:RUNNER_TEMP "socialbu-release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          gh release download $env:RELEASE_VERSION --repo socialbu/socialbu-cli --pattern $archiveName --pattern checksums.txt --dir $releaseDir

          $checksumLine = Get-Content (Join-Path $releaseDir "checksums.txt") |
            Where-Object { $_ -match "\s+$([regex]::Escape($archiveName))$" } |
            Select-Object -First 1
          if (-not $checksumLine) {
            throw "Release checksums do not contain $archiveName"
          }

          $checksum = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actualChecksum = (Get-FileHash (Join-Path $releaseDir $archiveName) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualChecksum -ne $checksum) {
            throw "Published archive does not match checksums.txt"
          }

          $packageDir = Join-Path $env:RUNNER_TEMP "socialbu-chocolatey"
          Copy-Item packaging/chocolatey -Destination $packageDir -Recurse
          $nuspec = Join-Path $packageDir "socialbu.nuspec"
          $installScript = Join-Path $packageDir "tools/chocolateyinstall.ps1"
          (Get-Content $nuspec -Raw).Replace('__VERSION__', $version) |
            Set-Content $nuspec -NoNewline
          $installContent = (Get-Content $installScript -Raw).Replace('__VERSION__', $version).Replace('__CHECKSUM64__', $checksum)
          Set-Content $installScript $installContent -NoNewline

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          choco pack $nuspec --outputdirectory dist
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey package creation failed"
          }

      - name: Test Chocolatey package
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $source = (Resolve-Path dist).Path
          choco install socialbu --version $version --source $source --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey package installation failed"
          }
          $versionOutput = socialbu version
          if ($versionOutput -notcontains "socialbu $version") {
            throw "Chocolatey package did not install the expected version"
          }

      - name: Attach Chocolatey package to release
        shell: pwsh
        run: |
          $package = Get-ChildItem dist -Filter '*.nupkg' | Select-Object -First 1
          if (-not $package) {
            throw "The release workflow did not produce a Chocolatey package"
          }
          gh release upload $env:RELEASE_VERSION $package.FullName --clobber

      - name: Publish Chocolatey package
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        run: |
          $package = Get-ChildItem dist -Filter '*.nupkg' | Select-Object -First 1
          choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
